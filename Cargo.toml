[package]
name = "janus"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Paul Gerhart"]
description = "Janus: adaptively secure distributed key generation for DLog-based threshold cryptosystems"
keywords = ["threshold", "dkg", "schnorr", "adaptive", "cryptography"]
categories = ["cryptography"]

[dependencies]
curve25519-dalek = { version = "5", features = [
    "digest",
    "serde",
    "rand_core",
    "zeroize",
] }
serde = { version = "1", features = ["derive"] }
merlin = "3"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
rand = "0.10"
rand_core = "0.10"
rand_chacha = "0.10"
ed25519-dalek = { version = "3", features = [
    "rand_core",
    "serde",
    "batch",
] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rayon = "1.10"


[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "one_round_dkg_run"
harness = false

[[bench]]
name = "two_round_dkg_run"
harness = false

[[bench]]
name = "two_round_components"
harness = false

[[bench]]
name = "one_round_components"
harness = false

[[bench]]
name = "abort_path"
harness = false

[[bench]]
name = "optimizations"
harness = false
